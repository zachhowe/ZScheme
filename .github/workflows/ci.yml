name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build ZScheme.slnx --nologo
      # A crashing test host otherwise fails the step with nothing but an exit code -- no test
      # name, no reason. --blame-crash names the reason inline ("Test host process crashed :
      # Stack overflow." -- the documented failure mode of a TCO regression, which takes the
      # host down instead of failing) and records every test the host ran in a Sequence.xml,
      # where the one left Completed="False" is the suspect. It costs nothing on a passing run:
      # the results directory stays empty.
      - run: dotnet test ZScheme.slnx --no-build --nologo --blame-crash --blame-crash-dump-type mini --results-directory TestResults
      # Only the sequence files. The dumps land beside them but stay on the runner: the compiler
      # test host peaks near 4 GB, so its minidump is far too big to be worth uploading, and the
      # crash reason is already in the log above.
      - name: Upload crash blame sequence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-blame-${{ matrix.os }}
          path: TestResults/**/Sequence_*.xml
          if-no-files-found: ignore

  # AOT is the one thing that cannot be validated by a normal build, and it is only exercised at
  # release time otherwise -- which is exactly when a failure is most expensive.
  aot-smoke:
    name: AOT publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-15-intel,   rid: osx-x64 }
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-11-arm,   rid: win-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the native toolchain
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: pwsh ./publish-zsup.ps1 -Runtime ${{ matrix.rid }}

  # The end-to-end proof that an installed toolchain is actually usable: it installs from a locally
  # built archive, switches between two versions, and compiles a program that imports stdlib.
  e2e:
    name: End-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: macos-latest,   rid: osx-arm64 }
          - { os: windows-latest, rid: win-x64 }
    env:
      # Isolated from the runner's real home so nothing leaks between steps.
      ZSCHEME_HOME: ${{ github.workspace }}/.zscheme-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the native toolchain
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      # One command per step on purpose. GitHub's pwsh shell -- the default on the Windows runner
      # -- reports only the LAST command's exit code, so a publish.ps1 that failed ahead of a
      # publish-zsup.ps1 that succeeded left this step green and the failure surfaced two steps
      # later as a missing archive.
      - name: Build the toolchain archive
        run: pwsh ./publish.ps1 -Runtimes ${{ matrix.rid }}
      - name: Build zsup
        run: pwsh ./publish-zsup.ps1 -Runtime ${{ matrix.rid }}
      - name: Run the end-to-end checks
        run: pwsh ./scripts/Test-Toolchain.ps1 -Rid ${{ matrix.rid }}
