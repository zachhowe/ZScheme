name = "ZScheme Package"
grammar = "zscheme"
path_suffixes = ["zspkg"]
line_comments = ["; "]
autoclose_before = "])"
brackets = [
    { start = "(", end = ")", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
]
word_characters = ["_", "-", "?", "!", ">", "+", "*", "/", "=", "<", "&", "|", "%", "^", "~", "#", "@"]
